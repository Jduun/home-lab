apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  namespace: nginx
  labels:
    app.kubernetes.io/name: nginx

spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx

    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: docker.io/chainguard/nginx@sha256:c1642395cc75f39c931d66d939f7e78cbdf671d6cfd821616632b0639c3c6d63
          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /var/lib/nginx/tmp

      volumes:
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
